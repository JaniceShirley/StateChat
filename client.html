<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StateChat</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  #log { border: 1px solid #999; height: 320px; overflow-y: auto; padding: 8px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  .err { color: #b00020; } .ok { color: #1b7f3b; } .sys { color: #666; }
  form { display: flex; gap: 8px; margin-top: 8px; } input { flex: 1; padding: 8px; }
</style>
</head>
<body>
<h1>StateChat</h1>
<p>Try <code>/login alice</code>, then <code>/join dev</code>, then type a message.</p>
<div id="log"></div>
<form id="f"><input id="m" autocomplete="off" placeholder="Type a command or message" autofocus><button>Send</button></form>
<script>
  const log = document.getElementById("log");
  const ws = new WebSocket("ws://localhost:8765");
  const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; d.className = cls || ""; log.appendChild(d); log.scrollTop = log.scrollHeight; };
  ws.onmessage = e => add(e.data, e.data.startsWith("ERROR") ? "err" : e.data.startsWith("OK") ? "ok" : "");
  ws.onopen = () => add("connected", "sys");
  ws.onclose = () => add("disconnected", "sys");
  document.getElementById("f").onsubmit = ev => {
    ev.preventDefault();
    const m = document.getElementById("m");
    if (m.value && ws.readyState === 1) { ws.send(m.value); m.value = ""; }
  };
</script>
</body>
</html>
